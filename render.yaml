# Render Blueprint: PostgreSQL + FastAPI API (Docker). The dashboard is hosted on Vercel (frontend/vercel.json).
# Deploy: https://render.com/deploy?repo=https://github.com/kartikkumarbadgujar/pocketlab
# The Android execution worker is NOT deployed here (it needs the Android SDK and hardware virtualization);
# run it on a laptop/VM pointed at the API URL. See backend/docs/DEPLOY_RENDER.md.

databases:
  - name: pocketlab-kkb-db
    databaseName: pocketlab
    user: pocketlab
    plan: free
    region: singapore

services:
  - type: web
    name: pocketlab-kkb-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Migrations and the (idempotent) catalog seed run on every start; proxy headers give per-client rate limiting.
    dockerCommand: sh -c "alembic upgrade head && python -m scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pocketlab-kkb-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RUNNER_TOKEN
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://127.0.0.1:5173"]'
      # The Vercel dashboard (production and preview deployments of the "pocketlab" project).
      # Tighten to the exact production domain once it is known.
      - key: CORS_ORIGIN_REGEX
        value: '^https://pocketlab[a-z0-9-]*\.vercel\.app$'
      # Render's edge only routes this service's own hostnames to it; health checks use an internal Host header.
      - key: TRUSTED_HOSTS
        value: '["*"]'
      - key: UPLOAD_DIR
        value: /app/private_uploads
