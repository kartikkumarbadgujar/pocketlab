services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketlab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["pocketlab_pg:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["pocketlab_uploads:/app/private_uploads"]
volumes:
  pocketlab_pg:
  pocketlab_uploads:
